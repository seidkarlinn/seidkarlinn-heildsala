[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML must never be held by an intermediate cache: the app ships as a single
# index.html, so a stale copy hides every deploy. Static assets keep their
# default caching. CDN-Cache-Control is honoured by CDNs in front of Netlify
# (e.g. Cloudflare); Netlify-CDN-Cache-Control covers Netlify's own edge.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

# img-fixes is declared first, so it is the OUTERMOST wrapper and rewrites
# stale product-image URLs in the finished HTML — including the products the
# functions below inject.
[[edge_functions]]
  path = "/"
  function = "img-fixes"

# category-order runs BEFORE inject-catalog so it is the OUTER wrapper and
# post-processes inject-catalog's already-transformed HTML (covers the
# edge-injected CordyFresh + 2026-05-28 products too).
[[edge_functions]]
  path = "/"
  function = "category-order"

[[edge_functions]]
  path = "/"
  function = "inject-catalog"

# inject-stock-layer is declared LAST, so it is the INNERMOST wrapper: it adds
# the <script src="/ws-stock-layer.js"> tag before </body> and the functions
# above then transform HTML that already contains it. Order does not matter for
# correctness here (the tag is not what they rewrite), only for predictability.
[[edge_functions]]
  path = "/"
  function = "inject-stock-layer"

