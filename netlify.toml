[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# fix-fruit-data runs FIRST (outermost) so it post-processes the final HTML
# after category-order + inject-catalog. It corrects 3 stale freeze-dried
# fruit weights/prices (Bláber, Brómber, Bananar) to match retail
# (seidkarlinn.is / Shopify). See netlify/edge-functions/fix-fruit-data.js.
[[edge_functions]]
  path = "/"
  function = "fix-fruit-data"

# category-order runs BEFORE inject-catalog so it is the OUTER wrapper and
# post-processes inject-catalog's already-transformed HTML (covers the
# edge-injected CordyFresh + 2026-05-28 products too).
[[edge_functions]]
  path = "/"
  function = "category-order"

[[edge_functions]]
  path = "/"
  function = "inject-catalog"

# ws-data sync enabled
