<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staðfesti greiðslu — Seiðkarlinn Heildsala</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--green:#2A5C2A;--green-l:#E6F0E6;--gold:#B8860B;--ink:#1A1710;--ink2:#5C5848;--paper:#FAF8F3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
  .card{background:#fff;border-radius:16px;padding:3rem 2.5rem;width:min(480px,100%);text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.08);}
  .icon{font-size:56px;margin-bottom:1rem;}
  h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--green);margin-bottom:.75rem;}
  p{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:.5rem;}
  .order-id{font-size:12px;background:var(--green-l);color:var(--green);padding:6px 14px;border-radius:99px;display:inline-block;margin:1rem 0;font-weight:500;}
  .back-btn{display:inline-block;margin-top:1.5rem;padding:10px 24px;background:var(--green);color:#fff;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;}
  .back-btn:hover{background:#1e431e;}
  .note{font-size:11px;color:#999;margin-top:1rem;}
  .card.fail h1{color:#C0392B;}
  .card.fail .order-id{background:#FDECEA;color:#C0392B;}
  .spin{display:inline-block;width:40px;height:40px;border:4px solid var(--green-l);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon"><span class="spin"></span></div>
  <h1 id="title">Staðfesti greiðslu…</h1>
  <p id="msg">Augnablik — við erum að staðfesta greiðsluna hjá Teya.</p>
  <p id="msg2"></p>
  <div class="order-id" id="orderId">Pöntunarnúmer: —</div>
  <br>
  <a href="/index.html" class="back-btn">← Til baka í verslun</a>
  <p class="note">Spurningar? Sendu okkur tölvupóst á <a href="mailto:seidkarlinn@seidkarlinn.is" style="color:var(--green)">seidkarlinn@seidkarlinn.is</a></p>
</div>
<script>
  // The pöntun is only confirmed once Teya says the payment SUCCEEDED.
  // Landing on this page is not proof of payment on its own.
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order');
  const $ = (id) => document.getElementById(id);
  if (orderId) $('orderId').textContent = 'Pöntunarnúmer: ' + orderId;

  function show(state) {
    if (state === 'paid') {
      $('icon').textContent = '✅';
      $('title').textContent = 'Pöntun staðfest!';
      $('msg').textContent = 'Greiðslan tókst. Við munum hafa samband við þig fljótlega til að staðfesta heildsölupöntunina þína.';
      $('msg2').textContent = 'Kvittun hefur verið send á netfangið þitt.';
      try { sessionStorage.removeItem('ws_cart'); } catch (e) {}
    } else if (state === 'failed' || state === 'expired') {
      $('card').classList.add('fail');
      $('icon').textContent = '❌';
      $('title').textContent = 'Greiðsla tókst ekki';
      $('msg').textContent = 'Kortinu var hafnað eða greiðslan rann út. Pöntunin hefur ekki verið staðfest og ekkert var skuldfært.';
      $('msg2').textContent = 'Reyndu aftur með öðru korti eða veldu reikningsviðskipti.';
    } else {
      $('icon').textContent = '⏳';
      $('title').textContent = 'Greiðsla í vinnslu';
      $('msg').textContent = 'Teya hefur ekki enn staðfest greiðsluna. Pöntunin verður staðfest sjálfkrafa um leið og greiðslan berst.';
      $('msg2').textContent = 'Ef ekkert gerist innan nokkurra mínútna, hafðu samband við okkur.';
    }
  }

  async function verify(attempt) {
    if (!orderId) return show('unknown');
    try {
      const r = await fetch('/.netlify/functions/teya-verify?order=' + encodeURIComponent(orderId), { cache: 'no-store' });
      const j = await r.json();
      // The order push from checkout may still be in flight: retry a few times.
      if ((r.status === 404 || j.paymentStatus === 'awaiting') && attempt < 6) {
        return setTimeout(() => verify(attempt + 1), 2500);
      }
      show(j.paymentStatus);
    } catch (e) {
      if (attempt < 6) return setTimeout(() => verify(attempt + 1), 2500);
      show('unknown');
    }
  }
  verify(0);
</script>
</body>
</html>
